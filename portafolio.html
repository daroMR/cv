<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portafolio — Hesvin D. Molina R.</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b0c0d;--card:#0f1113;--muted:#9aa3a8;--accent:#d9d7d0}
    *{box-sizing:border-box}
    body{margin:0;font-family:Montserrat,system-ui,Arial;background:var(--bg);color:var(--accent);-webkit-font-smoothing:antialiased}
    .container{max-width:1100px;margin:2rem auto;padding:1rem}
    header{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}
    h1{font-weight:700;margin:0;font-size:1.1rem;color:#fff}
    .wall{column-count:4;column-gap:1rem}
    .tile{display:inline-block;width:100%;margin:0 0 1rem;border-radius:8px;overflow:hidden;background:var(--card);box-shadow:0 6px 24px rgba(0,0,0,0.6);transition:transform .18s ease}
    .tile:hover{transform:translateY(-6px)}
    .tile img{width:100%;height:auto;display:block;background:#0b0c0d}
    .tile .caption{padding:0.5rem 0.6rem;color:var(--muted);font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:1000px){.wall{column-count:3}}@media(max-width:700px){.wall{column-count:2}}@media(max-width:420px){.wall{column-count:1}}
    .carousel{position:relative;background:var(--card);border-radius:10px;padding:1rem;display:flex;align-items:center;justify-content:center;min-height:320px;margin-bottom:1rem}
    .carousel img{max-width:100%;max-height:70vh;border-radius:8px;display:block;box-shadow:0 18px 60px rgba(0,0,0,0.7)}
    .meta{margin-top:0.6rem;color:var(--muted);text-align:center}
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:1200;padding:20px}
    .lightbox img{max-width:96%;max-height:92%;border-radius:8px}
    .lb-caption{position:absolute;bottom:36px;color:#ddd;font-size:14px}
    .lb-nav{position:absolute;left:12px;right:12px;top:50%;display:flex;justify-content:space-between;transform:translateY(-50%);pointer-events:none}
    .lb-nav button{pointer-events:auto;background:rgba(255,255,255,0.06);border:0;color:var(--accent);padding:0.6rem;border-radius:6px}
    .pdfs{margin-bottom:1.5rem;display:flex;flex-wrap:wrap;gap:0.6rem}
    .pdf-btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--accent);padding:0.45rem 0.7rem;border-radius:8px;text-decoration:none;font-size:0.95rem}
    footer{margin-top:2rem;color:var(--muted);font-size:0.9rem;text-align:center}
  </style>
</head>
<body>
  <div class="container">
    <header><h1>Portafolio — Hesvin D. Molina R.</h1></header>

    <main>
      <section id="pdf-area"><h2 style="color:#fff;font-size:1rem;margin-top:0">Documentos (PDF)</h2><div id="pdf-list" class="pdfs"></div></section>
      <section id="gallery-area">
        <div id="carousel" class="carousel"><div style="color:var(--muted)">Cargando imágenes...</div></div>
        <div id="carousel-meta" class="meta"></div>
        <div id="wall" class="wall" aria-live="polite"></div>
      </section>
    </main>
    <footer>Presiona una imagen para ampliar.</footer>
  </div>

<script>
const GALLERY_DIR = 'galeria/';
let images=[], pdfs=[];
const io = ('IntersectionObserver' in window) ? new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){const img=e.target;const src=img.dataset.src;if(src){img.src=src;img.removeAttribute('data-src')}io.unobserve(img)}})}, {rootMargin:'200px'}) : null;
function createImgElement(dataSrc, alt){const im=document.createElement('img');im.alt=alt;im.src='img/thumb_missing.svg';if(dataSrc){im.setAttribute('data-src', dataSrc); if(io) io.observe(im); else im.src=dataSrc}im.loading='lazy';return im}
async function loadFromJson(){try{const res=await fetch(GALLERY_DIR+'gallery_index.json');if(!res.ok) throw new Error('no json');const data=await res.json();images=data.images.map(i=>({name:i.display, orig:GALLERY_DIR+i.orig, thumb:i.thumb?GALLERY_DIR+i.thumb:null}));pdfs=data.pdfs.map(p=>({name:p.display, orig:GALLERY_DIR+p.orig}));return true}catch(e){return false}}
async function loadFromDir(){const res=await fetch(GALLERY_DIR);if(!res.ok) throw new Error('dir');const text=await res.text();const doc=new DOMParser().parseFromString(text,'text/html');const hrefs=Array.from(doc.querySelectorAll('a')).map(a=>a.getAttribute('href')).filter(h=>h&&h!='../');const imgExt=['.png','.jpg','.jpeg','.gif','.webp','.bmp','.tiff','.svg'];const pdfExt=['.pdf'];const imgs=[], pds=[];for(const h of hrefs){if(h.endsWith('/')) continue; const low=h.toLowerCase(); if(imgExt.some(e=>low.endsWith(e))) imgs.push(h); else if(pdfExt.some(e=>low.endsWith(e))) pds.push(h)} images=imgs.sort().map(h=>({name:decodeURIComponent(h), orig:GALLERY_DIR+h, thumb:null})); pdfs=pds.sort().map(h=>({name:decodeURIComponent(h), orig:GALLERY_DIR+h}));
}
async function findThumb(base){const enc=encodeURIComponent(base);const cands=[`thumbs/prev_${enc}.png`,`thumbs/prev_${enc}.gif`,`thumbs/prev_${enc}.svg`,`thumbs/prev_${enc}.jpg`];for(const c of cands){try{const r=await fetch(GALLERY_DIR+c,{method:'HEAD'});if(r.ok) return GALLERY_DIR+c}catch(e){} }return null}
async function populateThumbs(){for(let i=0;i<images.length;i++){const base=images[i].name.replace(/\.[^/.]+$/,'');const t=await findThumb(base);images[i].thumb=t}}
function renderWall(){const wall=document.getElementById('wall');wall.innerHTML='';images.forEach(img=>{const tile=document.createElement('div');tile.className='tile';const a=document.createElement('a');a.href=img.orig;a.onclick=e=>{e.preventDefault();openLightbox(img)};const dataSrc=img.thumb?img.thumb:img.orig;const im=createImgElement(dataSrc,img.name);a.appendChild(im);const cap=document.createElement('div');cap.className='caption';cap.textContent=img.name.replace(/\.[^/.]+$/,'');tile.appendChild(a);tile.appendChild(cap);wall.appendChild(tile)})}
function initCarousel(){const car=document.getElementById('carousel');const meta=document.getElementById('carousel-meta');if(images.length===0){car.innerHTML='<div style="color:var(--muted)">No hay imágenes</div>';meta.textContent='';return}let cur=0;function show(i){cur=(i+images.length)%images.length;const it=images[cur];car.innerHTML='';const imgEl=createImgElement(it.orig,it.name);imgEl.style.cursor='zoom-in';imgEl.onclick=()=>openLightbox(it);car.appendChild(imgEl);const nav=document.createElement('div');nav.className='nav';const left=document.createElement('button');left.textContent='◀';left.onclick=()=>show(cur-1);const right=document.createElement('button');right.textContent='▶';right.onclick=()=>show(cur+1);nav.appendChild(left);nav.appendChild(right);car.appendChild(nav);meta.textContent=`${cur+1} / ${images.length} — ${it.name.replace(/\.[^/.]+$/,'')}` } show(0);window.carouselNext=()=>show(cur+1);window.carouselPrev=()=>show(cur-1)}
function openLightbox(item){const overlay=document.createElement('div');overlay.className='lightbox';overlay.tabIndex=-1;const img=document.createElement('img');img.src=item.orig;img.alt=item.name;const caption=document.createElement('div');caption.className='lb-caption';caption.textContent=item.name.replace(/\.[^/.]+$/,'');const nav=document.createElement('div');nav.className='lb-nav';const prevBtn=document.createElement('button');prevBtn.textContent='◀';prevBtn.onclick=(e)=>{e.stopPropagation();navigateLightbox(-1)};const nextBtn=document.createElement('button');nextBtn.textContent='▶';nextBtn.onclick=(e)=>{e.stopPropagation();navigateLightbox(1)};nav.appendChild(prevBtn);nav.appendChild(nextBtn);overlay.appendChild(img);overlay.appendChild(caption);overlay.appendChild(nav);overlay.addEventListener('click',()=>overlay.remove());overlay.addEventListener('keydown',(e)=>{if(e.key==='ArrowRight')navigateLightbox(1);if(e.key==='ArrowLeft')navigateLightbox(-1);if(e.key==='Escape')overlay.remove()});document.body.appendChild(overlay);overlay.focus();function navigateLightbox(delta){if(images.length===0) return;const idx=images.findIndex(it=>it.orig===item.orig);const next=(idx+delta+images.length)%images.length;const nextItem=images[next];img.src=nextItem.orig;caption.textContent=nextItem.name.replace(/\.[^/.]+$/,'');item=nextItem}}
function renderPDFs(){const list=document.getElementById('pdf-list');list.innerHTML='';pdfs.forEach(p=>{const a=document.createElement('a');a.className='pdf-btn';a.href=p.orig;a.target='_blank';a.rel='noopener';a.textContent=p.name;list.appendChild(a)})}
async function loadGallery(){const ok=await loadFromJson().catch(()=>false);if(!ok) await loadFromDir().catch(()=>{document.getElementById('wall').innerHTML='<div style="padding:2rem;color:var(--muted)">No se pudo cargar la galería. Asegura que la carpeta "galeria/" existe y es accesible.</div>';throw new Error('no gallery')});await populateThumbs();renderPDFs();initCarousel();renderWall()}
loadGallery();
</script>
</body>
</html>
