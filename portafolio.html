<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Hesvin Darío Molina Ríos</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portafolio.css">
    <style>
        body {
            background: #181818;
            color: #fff;
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .construccion {
            font-size: 1.5rem;
            font-weight: 700;
            color: #b0bec5; /* gris claro */
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .btn-volver {
            background: #b0bec5; /* gris claro */
            color: #181818;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }
        .btn-volver:hover {
            background: #757575; /* gris oscuro */
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align:center; margin: 2rem 0 1rem 0;">Portafolio</h1>
    </header>
    <main class="center-content">
        <div>
            <div class="construccion">
                🚧 Esta sección está en construcción.<br>
                Próximamente podrás ver mi galería de diseños y videos destacados.
            </div>
            <button class="btn-volver" onclick="window.location.href='index.html'">
                Volver al inicio
            </button>
        </div>
    </main>
</body>
</html>
