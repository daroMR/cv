<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Hesvin Darío Molina Ríos</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #181818;
            color: #fff;
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .carousel-container {
            max-width: 700px;
            margin: 2rem auto 1rem auto;
            background: #23272f;
            border-radius: 16px;
            box-shadow: 0 2px 8px #0005;
            overflow: hidden;
            position: relative;
        }
        .carousel-slide {
            display: none;
            width: 100%;
            height: 340px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .carousel-slide.active {
            display: flex;
        }
        .carousel-img {
            max-width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: 10px;
            background: #222;
            margin-bottom: 1rem;
        }
        .carousel-caption {
            color: #b0bec5;
            font-size: 1.1rem;
            text-align: center;
            padding: 0 1rem;
        }
        .carousel-controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0;
        }
        .carousel-btn {
            background: #b0bec5;
            color: #181818;
            border: none;
            border-radius: 50%;
            width: 2.5rem;
            height: 2.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .carousel-btn:hover, .carousel-btn:focus {
            background: #757575;
            color: #fff;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            padding: 2rem 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .gallery-item {
            background: #23272f;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px #0005;
            transition: transform 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }
        .gallery-item:hover, .gallery-item:focus {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 4px 16px #0007;
        }
        .gallery-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #222;
            border-bottom: 1px solid #333;
        }
        .gallery-title {
            padding: 1rem 0.5rem 0.5rem 0.5rem;
            font-size: 1rem;
            color: #b0bec5;
            text-align: center;
        }
        .btn-volver {
            background: #b0bec5;
            color: #181818;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin: 2rem auto 1rem auto;
            display: block;
        }
        .btn-volver:hover, .btn-volver:focus {
            background: #757575;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align:center; margin: 2rem 0 1rem 0;">Portafolio</h1>
    </header>
    <!-- Carrusel simple -->
    <div class="carousel-container" id="carousel">
        <div class="carousel-slide active">
            <img class="carousel-img" src="galeria/ejemplo de croquis de ubicacion en tms para tad olmeca en dos bocas tabasco.gif" alt="Croquis de ubicación TMS">
            <div class="carousel-caption">Croquis de ubicación TMS</div>
        </div>
        <div class="carousel-slide">
            <img class="carousel-img" src="galeria/ejemplo de diseno de logotipo.jpg" alt="Diseño de logotipo">
            <div class="carousel-caption">Diseño de logotipo</div>
        </div>
        <div class="carousel-slide">
            <img class="carousel-img" src="galeria/ejemplo de diseno de logotipo - copia.jpg" alt="Diseño de logotipo variante">
            <div class="carousel-caption">Diseño de logotipo (variante)</div>
        </div>
        <div class="carousel-controls">
            <button class="carousel-btn" id="prevSlide" aria-label="Anterior">&#8592;</button>
            <button class="carousel-btn" id="nextSlide" aria-label="Siguiente">&#8594;</button>
        </div>
    </div>
    <!-- Galería de Imágenes -->
    <section class="gallery-section" style="margin:2rem 0;">
      <div class="gallery-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;max-width:900px;margin:0 auto;">
        <a href="galeria/ejemplo de croquis de ubicacion en tms para tad olmeca en dos bocas tabasco.gif" target="_blank" aria-label="Ver Croquis de ubicación TMS en grande">
          <img src="galeria/thumbs/ejemplo de croquis de ubicacion en tms para tad olmeca en dos bocas tabasco.gif" alt="Croquis de ubicación TMS" class="gallery-thumb" loading="lazy">
        </a>
        <a href="galeria/ejemplo de diseno de logotipo.jpg" target="_blank" aria-label="Ver Diseño de logotipo en grande">
          <img src="galeria/thumbs/ejemplo de diseno de logotipo.jpg" alt="Diseño de logotipo" class="gallery-thumb" loading="lazy">
        </a>
        <a href="galeria/ejemplo de diseno de logotipo - copia.jpg" target="_blank" aria-label="Ver Diseño de logotipo variante en grande">
          <img src="galeria/thumbs/ejemplo de diseno de logotipo - copia.jpg" alt="Diseño de logotipo variante" class="gallery-thumb" loading="lazy">
        </a>
        <!-- Más imágenes... -->
      </div>
    </section>
    <!-- Galería de PDFs -->
    <section class="gallery-section">
        <div class="gallery-grid">
            <a href="galeria/ejemplo de diagrama de armado para estructuras y ductos subterraneos .pdf" class="gallery-item" target="_blank" rel="noopener">
                <img class="gallery-thumb" src="galeria/pdf_thumb.png" alt="Diagrama de armado">
                <div class="gallery-title">Diagrama de armado</div>
            </a>
            <a href="galeria/ejemplo de diseno de producto con inyeccion de plastico - Protecctor para Botonera_1.pdf" class="gallery-item" target="_blank" rel="noopener">
                <img class="gallery-thumb" src="galeria/pdf_thumb.png" alt="Diseño de producto 1">
                <div class="gallery-title">Diseño de producto 1</div>
            </a>
            <a href="galeria/ejemplo de diseno de producto con inyeccion de plastico - Protecctor para Botonera_2.pdf" class="gallery-item" target="_blank" rel="noopener">
                <img class="gallery-thumb" src="galeria/pdf_thumb.png" alt="Diseño de producto 2">
                <div class="gallery-title">Diseño de producto 2</div>
            </a>
        </div>
    </section>
    <button class="btn-volver" id="btn-volver">
        Volver al inicio
    </button>
    <script>
        // Carrusel simple
        const slides = document.querySelectorAll('.carousel-slide');
        let currentSlide = 0;
        function showSlide(idx) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === idx);
            });
        }
        document.getElementById('prevSlide').onclick = () => {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            showSlide(currentSlide);
        };
        document.getElementById('nextSlide').onclick = () => {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        };
        // Botón volver al inicio
        document.getElementById('btn-volver').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
